<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.3" />

  <!-- Neon Glow effect -->
  <circle cx="256" cy="240" r="140" fill="#10b981" fill-opacity="0.15" filter="url(#glow)" />

  <!-- Delivery Bag & Box Graphic -->
  <g transform="translate(106, 96)">
    <!-- Main Box / Bag Body -->
    <rect x="30" y="90" width="240" height="200" rx="36" fill="url(#primaryGrad)" />
    
    <!-- Bag Handle -->
    <path d="M 90 90 C 90 35, 210 35, 210 90" fill="none" stroke="#6ee7b7" stroke-width="24" stroke-linecap="round" />
    
    <!-- Fast Speed Lines / Zap -->
    <path d="M 165 130 L 125 195 L 160 195 L 135 255 L 185 180 L 150 180 Z" fill="url(#accentGrad)" filter="url(#glow)" />
    
    <!-- Accent Star / Badge -->
    <circle cx="230" cy="130" r="18" fill="#f59e0b" />
    <path d="M 230 118 L 233 126 L 242 127 L 235 133 L 237 141 L 230 136 L 223 141 L 225 133 L 218 127 L 227 126 Z" fill="#ffffff" />
  </g>

  <!-- Text Trinidad Express -->
  <text x="256" y="445" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="2">
    PEDIDOS <tspan fill="#34d399">TRINIDAD</tspan>
  </text>
</svg>
